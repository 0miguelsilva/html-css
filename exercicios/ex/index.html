<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags em HTML5</title>
</head>
<body>
    <h1>Tags em HTML5</h1>
    <p>Em HTML5, podemos inserir os elementos da lista a seguir. Passe o mouse sobre os termos para descobrir qual tag deverá utilizar em cada uso.</p>
  

        <li title="Use as tags &lt;h1&gt; ... &lt;h6&gt;">titúlos</li>
        <li title="Use a tag &lt;img&gt;">imagens</li>
        <li title="Use a tag &lt;abbr&gt;">abreviações</li>
        <li title="Use a tag &lt;code&gt;">códigos-fonte</li>
        <li title="Use as tags &lt;ol&gt; e &lt;li&gt;">listas numeradas</li>
        <li title="Use as tags &lt;ul&gt; e &lt;li&gt;">listas com demarcadores</li>
        <li title="use a tag &lt; style &gt;" > estilo</li>
    </ul>
    
</body>
</html>
