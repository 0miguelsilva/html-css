<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midias em HTML5</title>
</head>
<body>
    <h1>imagem dinâmica</h1>
    <p>Tente abrir esse site em vários dispositivos diferentes ou simplismente aumente ou diminua o tamanho do seu navegador.</p>
    <picture>
        <source media="(max-width: 750px )" srcset="vscode-icon.png" type="image/png">
    <source media="(max-width: 1050px )" srcset="vscode-icon7.png" type="image/png">
        <img src="vscode-icon1.png" alt="Imagem flexível">
    </picture>

    <h1>reproduzindo áudio</h1>
    <p>Vamos aprender a reproduzir áudio em HTML5.</p>
    <audio preload="metadata">
        <source src="midia/Decay Tower - roljui.mp3" type="audio/mpeg">
        <source src="midia/Decay Tower - roljui.ogg" type="audio/ogg">
        <source src="midia/Decay Tower - roljui.wav" type="audio/wav">
        <p>Infelizmente, seu navegador não suporta a reprodução de audio. <a href="midia/Decay Tower - roljui.mp3">Clique aqui para baixar o arquivo MP3</a>
        </p>

    </audio>
</body>
</html>
