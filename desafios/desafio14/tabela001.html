<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabela</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
      }

      table {
        width: 450px;
        border-collapse: collapse;
      }

      th,
      td {
        border: 1px solid black;
        padding: 10px;
        text-align: center;
      }

      th {
        background-color: rgb(139, 137, 137);
        color: white;
      }

      .exatashumanas {
        background-color: white;
        color: black;
      }

      .numero {
        background-color: rgb(139, 137, 137);
        color: white;
      }

      .matemedia {
        text-align: left;
      }
    </style>
  </head>
  <body>
    <table>
      <thead>
        <tr>
          <th rowspan="2">Área</th>
          <th rowspan="2">Disciplinas</th>
          <th colspan="2">Notas</th>
          <th rowspan="2">Média</th>
        </tr>
        <tr>
          <th>Nota 1</th>
          <th>Nota 2</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th rowspan="4" scope="rowgroup" class="exatashumanas">Exatas</th>
          <td class="matemedia">Matemática</td>
          <td>8.0</td>
          <td>8.0</td>
          <td>8.0</td>
        </tr>
        <tr>
          <td class="matemedia">Física</td>
          <td>8.0</td>
          <td>8.0</td>
          <td>8.0</td>
        </tr>
        <tr>
          <td class="matemedia">Química</td>
          <td>8.0</td>
          <td>8.0</td>
          <td>8.0</td>
        </tr>
        <tr>
          <td class="matemedia">Biologia</td>
          <td>8.0</td>
          <td>8.0</td>
          <td>8.0</td>
        </tr>
        <tr>
          <th colspan="4" scope="col" class="matemedia">Média de Exatas</th>
          <td class="numero">8.0</td>
        </tr>
      </tbody>

      <tbody>
        <tr>
          <th rowspan="2" scope="rowgroup" class="exatashumanas">Humanas</th>
          <td class="matemedia">História</td>
          <td>8.0</td>
          <td>8.0</td>
          <td>8.0</td>
        </tr>
        <tr>
          <td class="matemedia">Geografia</td>
          <td>8.0</td>
          <td>8.0</td>
          <td>8.0</td>
        </tr>
      </tbody>

      <tfoot>
        <tr>
          <th colspan="4" scope="col" class="matemedia">Média de Humanas</th>
          <td class="numero">8.0</td>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
